name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: "gradle"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: doc-vault-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK to GitHub Release & apk-builds branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/doc-vault-week2.apk
          gh release create v0.2.0-week2 /tmp/doc-vault-week2.apk \
            --title "Document Vault v0.2.0 (Week 2 Test APK)" \
            --notes "Week 2 Android test build with encrypted Hive vault, camera/gallery capture, crop, and AES-256 encrypted photo storage." \
             || gh release upload v0.2.0-week2 /tmp/doc-vault-week2.apk --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-builds
          git rm -rf .
          cp /tmp/doc-vault-week2.apk doc-vault-week2.apk
          git add doc-vault-week2.apk
          git commit -m "APK build for ${GITHUB_SHA}"
          git push -f origin apk-builds
