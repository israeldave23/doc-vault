name: doc_vault
description: Document Expiry Vault - scan IDs, licenses and permits, get reminded before they expire. Offline and private.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  image_cropper: ^11.0.0
  encrypt: ^5.0.3
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.0
  intl: ^0.20.0
  google_mlkit_text_recognition: ^0.17.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  local_auth: ^3.0.2
  file_picker: ^10.2.4
  pointycastle: ^3.9.1
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
