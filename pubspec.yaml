name: doc_vault
description: Document Expiry Vault - scan IDs, licenses and permits, get reminded before they expire. Offline and private.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
